<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paint Studio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #1e1f26;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    color: #e8e9ee;
  }
  header {
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    background: #26272f;
    border-bottom: 1px solid #34353f;
  }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .5px; margin-right: 8px; }
  header h1 span { color: #7c8cff; }
  .group {
    display: flex; align-items: center; gap: 6px;
    background: #1e1f26; border: 1px solid #34353f;
    border-radius: 10px; padding: 5px 8px;
  }
  .group label { font-size: 11px; color: #9a9cae; text-transform: uppercase; letter-spacing: .6px; }
  button.tool {
    border: none; background: transparent; color: #c6c8d4;
    font-size: 13px; padding: 6px 10px; border-radius: 7px; cursor: pointer;
    transition: background .15s, color .15s;
  }
  button.tool:hover { background: #33343e; }
  button.tool.active { background: #7c8cff; color: #fff; }
  input[type="range"] { width: 110px; accent-color: #7c8cff; }
  input[type="color"] {
    width: 30px; height: 30px; border: none; background: none;
    cursor: pointer; padding: 0; border-radius: 6px;
  }
  .swatches { display: flex; gap: 5px; }
  .swatch {
    width: 20px; height: 20px; border-radius: 50%; cursor: pointer;
    border: 2px solid transparent; transition: transform .1s;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { border-color: #fff; }
  #sizeLabel { font-size: 12px; min-width: 24px; text-align: right; color: #c6c8d4; }
  main { flex: 1; position: relative; overflow: hidden; }
  canvas {
    position: absolute; inset: 0;
    cursor: crosshair; background: #ffffff;
  }
  .hint {
    position: absolute; bottom: 10px; right: 14px;
    font-size: 11px; color: #fff; opacity: .35; pointer-events: none;
  }
</style>
</head>
<body>
<header>
  <h1>🎨 Paint<span>Studio</span></h1>

  <div class="group">
    <button class="tool active" id="brushBtn" title="Brush (B)">🖌 Brush</button>
    <button class="tool" id="eraserBtn" title="Eraser (E)">🧽 Eraser</button>
    <button class="tool" id="fillBtn" title="Fill background">🪣 Fill</button>
    <button class="tool" id="lineBtn" title="Line (L)">📏 Line</button>
    <button class="tool" id="rectBtn" title="Rectangle (R)">▭ Rect</button>
    <button class="tool" id="circleBtn" title="Ellipse (C)">◯ Ellipse</button>
  </div>

  <div class="group">
    <label>Color</label>
    <input type="color" id="colorPicker" value="#3b5bdb">
    <div class="swatches" id="swatches"></div>
  </div>

  <div class="group">
    <label>Size</label>
    <input type="range" id="sizeSlider" min="1" max="60" value="6">
    <span id="sizeLabel">6</span>
  </div>

  <div class="group">
    <button class="tool" id="undoBtn" title="Undo (Ctrl+Z)">↩ Undo</button>
    <button class="tool" id="clearBtn" title="Clear canvas">🗑 Clear</button>
    <button class="tool" id="saveBtn" title="Download PNG">💾 Save</button>
  </div>
</header>

<main id="stage">
  <canvas id="canvas"></canvas>
  <canvas id="preview" style="pointer-events:none;background:transparent;"></canvas>
  <div class="hint">B brush · E eraser · L line · R rect · C ellipse · Ctrl+Z undo</div>
</main>

<script>
const stage = document.getElementById('stage');
const canvas = document.getElementById('canvas');
const preview = document.getElementById('preview');
const ctx = canvas.getContext('2d');
const pctx = preview.getContext('2d');

let tool = 'brush';
let color = '#3b5bdb';
let size = 6;
let drawing = false;
let startX = 0, startY = 0;
let lastX = 0, lastY = 0;
const undoStack = [];
const MAX_UNDO = 30;

// --- canvas sizing ---
function resize() {
  const snapshot = document.createElement('canvas');
  snapshot.width = canvas.width; snapshot.height = canvas.height;
  if (canvas.width) snapshot.getContext('2d').drawImage(canvas, 0, 0);
  canvas.width = stage.clientWidth;
  canvas.height = stage.clientHeight;
  preview.width = stage.clientWidth;
  preview.height = stage.clientHeight;
  if (snapshot.width) ctx.drawImage(snapshot, 0, 0);
  else { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
}
window.addEventListener('resize', resize);
resize();

// --- undo ---
function pushUndo() {
  undoStack.push(canvas.toDataURL());
  if (undoStack.length > MAX_UNDO) undoStack.shift();
}
function undo() {
  if (!undoStack.length) return;
  const img = new Image();
  img.onload = () => {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
  };
  img.src = undoStack.pop();
}
document.getElementById('undoBtn').onclick = undo;

// --- tools UI ---
const toolBtns = { brush: brushBtn, eraser: eraserBtn, fill: fillBtn, line: lineBtn, rect: rectBtn, circle: circleBtn };
function setTool(t) {
  tool = t;
  Object.entries(toolBtns).forEach(([k, b]) => b.classList.toggle('active', k === t));
  preview.style.background = 'transparent';
}
Object.entries(toolBtns).forEach(([k, b]) => b.onclick = () => setTool(k));

// --- color ---
const colorPicker = document.getElementById('colorPicker');
colorPicker.oninput = e => { color = e.target.value; markSwatch(); };
const palette = ['#000000','#ffffff','#e03131','#f08c00','#ffd43b','#2f9e44','#1971c2','#3b5bdb','#9c36b5','#e64980','#868e96','#795548'];
const swatchBox = document.getElementById('swatches');
palette.forEach(c => {
  const d = document.createElement('div');
  d.className = 'swatch'; d.style.background = c; d.dataset.c = c;
  d.onclick = () => { color = c; colorPicker.value = c; markSwatch(); };
  swatchBox.appendChild(d);
});
function markSwatch() {
  document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s.dataset.c === color));
}
markSwatch();

// --- size ---
const sizeSlider = document.getElementById('sizeSlider');
sizeSlider.oninput = e => { size = +e.target.value; document.getElementById('sizeLabel').textContent = size; };

// --- drawing ---
function pos(e) {
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return [t.clientX - r.left, t.clientY - r.top];
}
function strokeStyle() {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = size;
  ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
}
function start(e) {
  e.preventDefault();
  const [x, y] = pos(e);
  if (tool === 'fill') {
    pushUndo();
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    return;
  }
  pushUndo();
  drawing = true;
  startX = lastX = x; startY = lastY = y;
  if (tool === 'brush' || tool === 'eraser') {
    strokeStyle();
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + .01, y + .01);
    ctx.stroke();
  }
}
function move(e) {
  if (!drawing) return;
  e.preventDefault();
  const [x, y] = pos(e);
  if (tool === 'brush' || tool === 'eraser') {
    strokeStyle();
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
  } else {
    pctx.clearRect(0, 0, preview.width, preview.height);
    pctx.lineWidth = size;
    pctx.strokeStyle = color;
    pctx.lineJoin = 'round';
    if (tool === 'line') {
      pctx.beginPath(); pctx.moveTo(startX, startY); pctx.lineTo(x, y); pctx.stroke();
    } else if (tool === 'rect') {
      pctx.strokeRect(startX, startY, x - startX, y - startY);
    } else if (tool === 'circle') {
      pctx.beginPath();
      pctx.ellipse((startX + x) / 2, (startY + y) / 2, Math.abs(x - startX) / 2, Math.abs(y - startY) / 2, 0, 0, Math.PI * 2);
      pctx.stroke();
    }
  }
  lastX = x; lastY = y;
}
function end(e) {
  if (!drawing) return;
  drawing = false;
  if (tool !== 'brush' && tool !== 'eraser') {
    ctx.drawImage(preview, 0, 0);
    pctx.clearRect(0, 0, preview.width, preview.height);
  }
}
canvas.addEventListener('mousedown', start);
canvas.addEventListener('mousemove', move);
window.addEventListener('mouseup', end);
canvas.addEventListener('touchstart', start, { passive: false });
canvas.addEventListener('touchmove', move, { passive: false });
canvas.addEventListener('touchend', end);

// --- clear & save ---
document.getElementById('clearBtn').onclick = () => {
  pushUndo();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
};
document.getElementById('saveBtn').onclick = () => {
  const a = document.createElement('a');
  a.download = 'painting.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
};

// --- keyboard shortcuts ---
window.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); return; }
  const map = { b: 'brush', e: 'eraser', l: 'line', r: 'rect', c: 'circle', f: 'fill' };
  const t = map[e.key.toLowerCase()];
  if (t && !e.ctrlKey && !e.metaKey) setTool(t);
});
</script>
</body>
</html>
